version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: grocera_postgres
    restart: always
    environment:
      POSTGRES_USER: grocera
      POSTGRES_PASSWORD: grocerapassword
      POSTGRES_DB: groceradb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: grocera_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
